<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实时会议纪要</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36;
    --fg: #e6e9ef; --dim: #8b93a5; --accent: #6ea8fe;
    --ok: #4ade80; --warn: #fbbf24; --err: #f87171;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6ec;
      --fg: #1a1d23; --dim: #6b7280; --accent: #2563eb;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--fg);
    font: 14px/1.6 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }

  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  .dot { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }
  .dot i {
    width: 8px; height: 8px; border-radius: 50%; background: var(--dim); display: block;
  }
  .dot.running i { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .dot.starting i { background: var(--warn); animation: pulse 1s infinite; }
  .dot.stopped i { background: #4b5563; }
  @keyframes pulse { 50% { opacity: .3; } }

  button {
    font: inherit; padding: 6px 16px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--accent); color: #fff; font-weight: 600;
  }
  button.ghost { background: transparent; color: var(--fg); font-weight: 400; }
  button.small { padding: 3px 10px; font-size: 12px; font-weight: 400; }
  button.danger { background: transparent; color: var(--err); border-color: var(--err); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  select, input {
    font: inherit; padding: 5px 8px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  input[type=number] { width: 72px; }
  label { color: var(--dim); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }

  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; min-height: 0; background: var(--line); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background: var(--bg); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  section > h2 {
    margin: 0; padding: 8px 16px; font-size: 12px; font-weight: 600; color: var(--dim);
    letter-spacing: .05em; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .scroll { flex: 1; overflow-y: auto; padding: 14px 16px; }

  .line { margin-bottom: 8px; }
  .ts {
    color: var(--dim); font-family: ui-monospace, Consolas, monospace;
    font-size: 11.5px; margin-right: 8px; user-select: none;
  }
  .speaker { color: var(--accent); font-size: 12px; margin-right: 6px; }
  .buffer { color: var(--dim); font-style: italic; }

  .overview {
    background: var(--panel); border-left: 3px solid var(--accent);
    padding: 10px 12px; border-radius: 4px; margin-bottom: 18px;
  }
  .group { margin-bottom: 18px; }
  .group h3 { font-size: 12px; color: var(--dim); margin: 0 0 6px; font-weight: 600; }
  .group ul { margin: 0; padding-left: 18px; }
  .group li { margin-bottom: 5px; }
  .owner { color: var(--accent); font-weight: 600; }
  .empty { color: var(--dim); padding: 40px 0; text-align: center; }

  footer { border-top: 1px solid var(--line); background: var(--panel); height: 150px; display: flex; flex-direction: column; }
  footer h2 { margin: 0; padding: 6px 16px; font-size: 12px; color: var(--dim); font-weight: 600; }
  #logs { flex: 1; overflow-y: auto; padding: 0 16px 10px; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; line-height: 1.5; }
  #logs div { color: var(--dim); white-space: pre-wrap; word-break: break-all; }
  #logs .error { color: var(--err); }

  /* ---- 历史会议 ---- */
  #history[hidden] { display: none; }
  #history {
    position: fixed; inset: 0; z-index: 20; background: var(--bg);
    display: flex; flex-direction: column;
  }
  #history > header { gap: 12px; }
  #history .body { flex: 1; display: grid; grid-template-columns: 320px 1fr; gap: 1px; background: var(--line); min-height: 0; }
  @media (max-width: 820px) { #history .body { grid-template-columns: 1fr; } #hist-detail { display: none; } }
  #hist-list, #hist-detail { background: var(--bg); overflow-y: auto; min-height: 0; }
  #hist-list { padding: 8px; }
  .mrow {
    padding: 10px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid transparent;
  }
  .mrow:hover { background: var(--panel); }
  .mrow.on { background: var(--panel); border-color: var(--accent); }
  .mrow .t { font-weight: 600; margin-bottom: 2px; }
  .mrow .s { color: var(--dim); font-size: 12px; }
  #hist-detail { padding: 18px 22px; }
  #hist-detail h3 { margin: 0 0 4px; font-size: 17px; }
  .meta { color: var(--dim); font-size: 12px; margin-bottom: 14px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  audio { width: 100%; margin-bottom: 16px; height: 36px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .tab {
    padding: 6px 14px; cursor: pointer; font-size: 13px; color: var(--dim);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab.on { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
  #hist-body { white-space: pre-wrap; word-break: break-word; }
  #hist-body .line { margin-bottom: 6px; }
</style>
</head>
<body>

<header>
  <h1>实时会议纪要</h1>
  <span class="dot" id="d-llm"><i></i>摘要模型</span>
  <span class="dot" id="d-asr"><i></i>转写服务</span>
  <span class="dot" id="d-pipe"><i></i>采集</span>

  <label>声音来源
    <select id="device"></select>
  </label>
  <label><input type="checkbox" id="loopback" checked> 采系统声音</label>
  <label><input type="checkbox" id="autogain" checked> 自动增益</label>
  <label>n-cpu-moe <input type="number" id="ncpumoe" min="0" max="64"></label>

  <span style="flex:1"></span>
  <span id="rec-info" class="dot"></span>
  <button id="btn-history" class="ghost">历史</button>
  <button id="btn-start">开始</button>
  <button id="btn-stop" class="ghost" disabled>停止</button>
</header>

<main>
  <section>
    <h2>实时转写</h2>
    <div class="scroll" id="transcript"><div class="empty">等待开始…</div></div>
  </section>
  <section>
    <h2 id="minutes-title">滚动纪要 · live_minutes.md</h2>
    <div class="scroll" id="minutes"><div class="empty">纪要会在这里持续更新</div></div>
  </section>
</main>

<footer>
  <h2>日志</h2>
  <div id="logs"></div>
</footer>

<div id="history" hidden>
  <header>
    <h1>历史会议</h1>
    <input id="hist-q" placeholder="搜标题、转写原文、纪要内容…" style="width:280px">
    <span id="hist-count" style="color:var(--dim);font-size:12px"></span>
    <span style="flex:1"></span>
    <button id="btn-close-history" class="ghost">关闭</button>
  </header>
  <div class="body">
    <div id="hist-list"></div>
    <div id="hist-detail"><div class="empty">左边选一场会议</div></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let state = "idle";
let current = null;          // 当前打开的历史会议
let tab = "minutes";

function setDot(el, s) { el.className = "dot " + s; }

function fmtTs(sec) {
  if (sec === null || sec === undefined || isNaN(sec)) return "--:--";
  const s = Math.max(0, Math.floor(sec));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  const pad = n => String(n).padStart(2, "0");
  return h ? `${h}:${pad(m)}:${pad(ss)}` : `${pad(m)}:${pad(ss)}`;
}

function fmtDate(epoch) {
  if (!epoch) return "";
  const d = new Date(epoch * 1000), pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} `
       + `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function renderStatus(msg) {
  state = msg.state;
  const svc = msg.services || {};
  setDot($("d-llm"), svc.llm || (state === "starting" ? "starting" : "stopped"));
  setDot($("d-asr"), svc.asr || (state === "starting" ? "starting" : "stopped"));
  setDot($("d-pipe"), state === "running" ? "running" : state === "starting" ? "starting" : "stopped");
  $("btn-start").disabled = state !== "idle";
  $("btn-stop").disabled = state === "idle";
  $("btn-start").textContent = state === "starting" ? "启动中…" : "开始";
  const m = msg.meeting;
  $("rec-info").textContent = m ? `● 录制中 ${m.title}` : "";
  $("rec-info").style.color = m ? "var(--err)" : "";
  $("minutes-title").textContent = m ? `滚动纪要 · meetings/${m.id}/` : "滚动纪要 · live_minutes.md";
}

function renderTranscript(msg) {
  const box = $("transcript");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  const parts = (msg.lines || []).map(l => {
    const ts = `<span class="ts">${fmtTs(l.beg)}</span>`;
    const sp = (l.speaker !== null && l.speaker !== undefined && l.speaker >= 0)
      ? `<span class="speaker">说话人 ${l.speaker}</span>` : "";
    return `<div class="line">${ts}${sp}${escape(l.text)}</div>`;
  });
  if (msg.buffer) parts.push(`<div class="line buffer">${escape(msg.buffer)}</div>`);
  box.innerHTML = parts.length ? parts.join("") : '<div class="empty">等待语音…</div>';
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function minutesHtml(msg) {
  if (!msg || !msg.total) return '<div class="empty">这场会议没有生成纪要</div>';
  let html = "";
  if (msg.overview) html += `<div class="overview">${escape(msg.overview)}</div>`;
  for (const g of msg.groups) {
    if (!g.items.length) continue;
    html += `<div class="group"><h3>${g.label}</h3><ul>`;
    for (const it of g.items) {
      const owner = it.owner ? `<span class="owner">@${escape(it.owner)}</span> ` : "";
      const star = it.hits >= 3 ? " ⭐" : "";
      html += `<li>${owner}${escape(it.text)}${star}</li>`;
    }
    html += "</ul></div>";
  }
  return html;
}

function renderMinutes(msg) {
  const box = $("minutes");
  if (!msg.total) { box.innerHTML = '<div class="empty">纪要会在这里持续更新</div>'; return; }
  box.innerHTML = minutesHtml(msg);
}

function addLog(msg) {
  const box = $("logs");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  const div = document.createElement("div");
  if (msg.level === "error") div.className = "error";
  div.textContent = `${msg.ts}  ${msg.text}`;
  box.appendChild(div);
  while (box.childNodes.length > 400) box.removeChild(box.firstChild);
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function escape(s) {
  return String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.type === "status") renderStatus(msg);
    else if (msg.type === "transcript") renderTranscript(msg);
    else if (msg.type === "minutes") renderMinutes(msg);
    else if (msg.type === "log") addLog(msg);
  };
  ws.onclose = () => setTimeout(connect, 1500);
}

async function loadState() {
  const s = await (await fetch("/api/state")).json();
  const sel = $("device");
  sel.innerHTML = "";
  const good = s.devices.filter(d => d.loopback_candidate);
  const rest = s.devices.filter(d => !d.loopback_candidate);
  const opt = (d, tag) => {
    const o = document.createElement("option");
    o.value = d.index;
    o.textContent = `${tag} ${d.name} — ${d.rate}Hz ${d.channels}ch`;
    if (d.index === s.config.audio.device) o.selected = true;
    sel.appendChild(o);
  };
  good.forEach(d => opt(d, "🔊"));
  rest.forEach(d => opt(d, "🎤"));
  if (!good.length) {
    const o = document.createElement("option");
    o.textContent = "未找到可用于采系统声音的 WASAPI 输出设备";
    o.disabled = true;
    sel.prepend(o);
  }
  $("loopback").checked = s.config.audio.loopback;
  $("autogain").checked = s.config.audio.auto_gain !== false;
  $("ncpumoe").value = s.config.llm.n_cpu_moe;
  renderStatus(s.status);
  renderMinutes(s.minutes);
}

async function patch(body) {
  await fetch("/api/config", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
}

// ---- 历史会议

async function loadHistory() {
  const q = $("hist-q").value.trim();
  const r = await (await fetch("/api/meetings?q=" + encodeURIComponent(q))).json();
  const rows = r.meetings || [];
  $("hist-count").textContent = q ? `${rows.length} 场匹配` : `共 ${rows.length} 场`;
  $("hist-list").innerHTML = rows.length ? rows.map(m => `
    <div class="mrow${current === m.id ? " on" : ""}" data-id="${m.id}">
      <div class="t">${escape(m.title)}</div>
      <div class="s">${fmtDate(m.started_at)} · ${fmtTs(m.duration)}
        · ${m.line_count || 0} 句 · ${m.item_count || 0} 条纪要${m.has_audio ? " · 🎧" : ""}</div>
    </div>`).join("") : '<div class="empty">还没有归档的会议</div>';
  for (const el of $("hist-list").querySelectorAll(".mrow")) {
    el.onclick = () => openMeeting(el.dataset.id);
  }
}

async function openMeeting(id) {
  current = id;
  await loadHistory();
  const r = await fetch("/api/meetings/" + id);
  if (!r.ok) { $("hist-detail").innerHTML = '<div class="empty">读取失败</div>'; return; }
  const d = await r.json();
  window._meeting = d;
  const m = d.meta;
  const audio = m.has_audio
    ? `<audio controls preload="none" src="/api/meetings/${id}/audio"></audio>` : "";
  $("hist-detail").innerHTML = `
    <h3 id="m-title" title="点击改名" style="cursor:text">${escape(m.title)}</h3>
    <div class="meta">${fmtDate(m.started_at)} · 时长 ${fmtTs(m.duration)}
      · 录音 ${fmtTs(m.audio_seconds)} · ${m.line_count || 0} 句 · ${m.item_count || 0} 条纪要</div>
    <div class="bar">
      <button class="small" data-fmt="md">导出纪要 .md</button>
      <button class="small" data-fmt="txt">导出转写 .txt</button>
      <button class="small" data-fmt="json">导出全部 .json</button>
      <span style="flex:1"></span>
      <button class="small danger" id="m-del">删除</button>
    </div>
    ${audio}
    <div class="tabs">
      <div class="tab${tab === "minutes" ? " on" : ""}" data-tab="minutes">纪要</div>
      <div class="tab${tab === "transcript" ? " on" : ""}" data-tab="transcript">转写原文</div>
    </div>
    <div id="hist-body"></div>`;
  for (const b of $("hist-detail").querySelectorAll("[data-fmt]")) {
    b.onclick = () => window.open(`/api/meetings/${id}/export?fmt=${b.dataset.fmt}`, "_blank");
  }
  for (const t of $("hist-detail").querySelectorAll(".tab")) {
    t.onclick = () => { tab = t.dataset.tab; openMeeting(id); };
  }
  $("m-del").onclick = () => deleteMeeting(id, m.title);
  $("m-title").onclick = () => renameMeeting(id, m.title);
  renderDetailBody();
}

function renderDetailBody() {
  const d = window._meeting;
  if (!d) return;
  if (tab === "minutes") {
    $("hist-body").innerHTML = minutesHtml(d.minutes);
  } else {
    const lines = (d.transcript || []).filter(l => (l.text || "").trim());
    $("hist-body").innerHTML = lines.length ? lines.map(l => {
      const sp = (l.speaker !== null && l.speaker !== undefined && l.speaker >= 0)
        ? `<span class="speaker">说话人 ${l.speaker}</span>` : "";
      return `<div class="line"><span class="ts">${fmtTs(l.beg)}</span>${sp}${escape(l.text)}</div>`;
    }).join("") : '<div class="empty">这场会议没有转写内容</div>';
  }
}

async function renameMeeting(id, old) {
  const title = prompt("会议标题", old);
  if (title === null || !title.trim() || title === old) return;
  await fetch(`/api/meetings/${id}/title`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title }),
  });
  await openMeeting(id);
}

async function deleteMeeting(id, title) {
  if (!confirm(`删除「${title}」？录音、转写、纪要都会一起删掉，无法恢复。`)) return;
  const r = await fetch("/api/meetings/" + id, { method: "DELETE" });
  if (!r.ok) { alert((await r.json()).error || "删除失败"); return; }
  current = null;
  $("hist-detail").innerHTML = '<div class="empty">左边选一场会议</div>';
  await loadHistory();
}

let qTimer = null;
$("hist-q").oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(loadHistory, 250); };
$("btn-history").onclick = () => { $("history").hidden = false; loadHistory(); };
$("btn-close-history").onclick = () => { $("history").hidden = true; };
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("history").hidden) $("history").hidden = true;
});

$("device").onchange = e => patch({ device: Number(e.target.value) });
$("loopback").onchange = e => patch({ loopback: e.target.checked });
$("autogain").onchange = e => patch({ auto_gain: e.target.checked });
$("ncpumoe").onchange = e => patch({ n_cpu_moe: Number(e.target.value) });
$("btn-start").onclick = () => fetch("/api/start", { method: "POST" });
$("btn-stop").onclick = () => fetch("/api/stop", { method: "POST" });

loadState();
connect();
</script>
</body>
</html>
